```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login FIT Wellness</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dcebe0, #21483d);
            padding: 20px;
        }

        .container {
            width: 900px;
            min-height: 500px;
            display: flex;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px #0003;
        }

        .kiri {
            width: 50%;
            background: linear-gradient(150deg, #438a73, #21483d);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .logo {
            font-size: 75px;
            color: #dcebe0;
            margin-bottom: 25px;
        }

        .kiri h1 {
            font-size: 28px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .kiri p {
            font-size: 13px;
            line-height: 1.8;
        }

        .kanan {
            width: 50%;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kanan h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #21483d;
        }

        .deskripsi {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #438a73;
        }

        .lupa {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
        }

        .lupa a {
            text-decoration: none;
            color: #438a73;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #438a73;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #21483d;
        }

        .kembali {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #438a73;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .kiri, .kanan {
                width: 100%;
            }

            .kiri {
                min-height: 250px;
            }

            .kiri h1 {
                font-size: 23px;
            }

            .kanan {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BAGIAN KIRI -->
        <div class="kiri">
            <div class="logo">🧘</div>

            <h1>FIT Wellness</h1>

            <p>
                Pilates • Gym • Yoga<br>
                Sehat Bergerak,<br>
                Seimbang Menjalani Hidup.
            </p>
        </div>

        <!-- BAGIAN KANAN -->
        <div class="kanan">
            <h2>Welcome Back!</h2>

            <p class="deskripsi">
                Masuk dan mulai perjalanan hidup sehatmu.
            </p>

            <form onsubmit="login(event)">

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <div class="lupa">
                    <a href="#"
                       onclick="alert('Silakan hubungi pengelola website untuk bantuan.'); return false;">
                        Lupa Password?
                    </a>
                </div>

                <button type="submit">Sign In</button>

            </form>

            <a href="index.html" class="kembali">
                ← Kembali ke Beranda
            </a>
        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            alert(
                "Selamat datang di FIT Wellness! " +
                "Halaman ini masih berupa demo login."
            );

            window.location.href = "index.html";
        }
    </script>

</body>
</html>
```
